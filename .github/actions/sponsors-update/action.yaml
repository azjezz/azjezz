name: "Update Sponsors"
description: "Fetches sponsors and updates markdown files."
inputs:
  files-to-update:
    description: "A space-separated list of files to update"
    required: false
    default: "README.md"
runs:
  using: "composite"
  steps:
    - name: Generate SPONSORS.md and update files
      shell: bash
      run: |
        curl -sSL https://raw.githubusercontent.com/azjezz/azjezz/develop/sponsors.json -o sponsors.json

        # Verify that the downloaded file is valid JSON
        if ! jq -e . sponsors.json > /dev/null 2>&1;
        then
          echo "Error: Downloaded sponsors.json is not valid JSON. Content:"
          cat sponsors.json
          exit 1
        fi

        OUTPUT_FILE="SPONSORS.md"
        (cat <<EOF
        # Sponsors

        A heartfelt thank you to the generous individuals and organizations listed below. Their support is instrumental in the continued development and maintenance of [Psl](https://github.com/azjezz/psl) and [Mago](https://github.com/carthage-software/mago).

        To become a sponsor, please visit [the sponsorship page](https://github.com/sponsors/azjezz).

        ---

        EOF
        ) > "$OUTPUT_FILE"

        jq -r 'keys | map(tonumber) | sort | reverse | map(tostring) | .[]' sponsors.json | while read -r key;
        do
            TIER_AMOUNT=$(echo "$key" | sed 's/"//g')
            echo "## Tier: \$$TIER_AMOUNT/month" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"

            jq -r --arg key "$key" '.[$key][] | "<a href=\"https://github.com/\(.login)\" title=\"\(.name)\"><kbd><img src=\"\(.avatarUrl)\" width=\"80\" height=\"80\" alt=\"\(.name)\" /></kbd></a>"' sponsors.json | tr -d '\n' >> "$OUTPUT_FILE"

            echo "" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"
        done

        TIERS_TO_SHOW=(500 250 100 50 25)
        SIZES=(140 120 100 80 60)
        SPONSORS_HTML=""

        for i in "${!TIERS_TO_SHOW[@]}"; do
          tier=${TIERS_TO_SHOW[$i]}
          size=${SIZES[$i]}
          sponsors_template=$(jq -r --arg key "$tier" '.[$key] // [] | .[] | "<a href=\"https://github.com/\(.login)\" title=\"\(.name)\"><kbd><img src=\"\(.avatarUrl)&s=__SIZE__\" width=\"__SIZE__\" height=\"__SIZE__\" alt=\"\(.name)\" /></kbd></a>"' sponsors.json | tr -d '\n')
          sponsors=$(echo "$sponsors_template" | sed "s/__SIZE__/$size/g")
          if [ -n "$sponsors" ]; then
            SPONSORS_HTML="$SPONSORS_HTML<p align=\"center\">$sponsors</p>"
          fi
        done

        SPONSORS_SNIPPET=""
        if [ -n "$SPONSORS_HTML" ]; then
            SPONSORS_SNIPPET=$(printf "### Our Sponsors\n\n%s\n\n[See all sponsors](SPONSORS.md)" "$SPONSORS_HTML")
        fi

        export SPONSORS_SNIPPET
        for file in ${{ inputs.files-to-update }};
        do
          if [ -f "$file" ]; then
            perl -i -p0e 's#<!-- START-SPONSORS -->.*<!-- END-SPONSORS -->#<!-- START-SPONSORS -->\n$ENV{SPONSORS_SNIPPET}\n<!-- END-SPONSORS -->#s' "$file"
          fi
        done
